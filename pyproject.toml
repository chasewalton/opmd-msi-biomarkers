[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opmd-msi-biomarkers"
version = "0.1.0"
description = "Reproducible ML pipeline that selects cell-surface biomarkers for molecular surgical imaging (MSI) of oral potentially malignant disorders (OPMDs)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Adilbay Lab" }
]
keywords = ["bioinformatics", "biomarker", "OPMD", "molecular-surgical-imaging", "SHAP", "Cox", "TCGA", "GEO"]

dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "scikit-survival>=0.22",
  "statsmodels>=0.14",
  "shap>=0.45",
  "pyyaml>=6.0",
  "click>=8.1",
  "rich>=13.7",
  "tqdm>=4.66",
  "requests>=2.31",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
fetch = [
  # GEO + TCGA fetchers. These are heavy; opt-in.
  "GEOparse>=2.0.4",
  "pybiomart>=0.2.0",
  "anndata>=0.10",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.8",
  "ipykernel>=6.29",
  "matplotlib>=3.8",
]

[project.scripts]
opmd-msi = "opmd_msi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opmd_msi = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM", "TID"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
